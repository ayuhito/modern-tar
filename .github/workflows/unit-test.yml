name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Lint package
        run: |
          pnpm exec publint --pack false
          pnpm exec attw --pack --profile esm-only .

      - name: Install benchmark dependencies
        working-directory: benchmarks
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck benchmarks
        working-directory: benchmarks
        run: npm exec tsc -- --noEmit

  test:
    name: ${{ matrix.project }} on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24]
        project: [node]
        include:
          - os: ubuntu-latest
            node-version: 24
            project: node
            coverage: true
          - os: ubuntu-latest
            node-version: 24
            project: workers
            build: true
          - os: ubuntu-latest
            node-version: 24
            project: browser
            browser: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup Node ${{ matrix.node-version }}
        if: matrix.node-version != 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false


      - name: Build
        if: matrix.build
        run: pnpm run build

      - name: Install Playwright browsers
        if: matrix.browser
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Test with coverage
        if: matrix.coverage
        run: node node_modules/vitest/vitest.mjs --project node --run --coverage

      - name: Test
        if: matrix.coverage != true
        run: node node_modules/vitest/vitest.mjs --project ${{ matrix.project }} --run
