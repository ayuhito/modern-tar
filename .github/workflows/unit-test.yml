name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Lint package
        run: |
          pnpm exec publint --pack false
          pnpm exec attw --pack --profile esm-only .

      - name: Install benchmark dependencies
        working-directory: benchmarks
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck benchmarks
        working-directory: benchmarks
        run: npm exec tsc -- --noEmit

      - name: Install packed library in a clean project
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          npm pack --pack-destination "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm install --no-save --ignore-scripts --no-audit --no-fund ./modern-tar-*.tgz

      - name: Setup minimum supported Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18.0.0
          package-manager-cache: false

      - name: Extract a file with the packed library
        working-directory: ${{ runner.temp }}/consumer
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { pipeline } from "node:stream/promises";
          import { packTar } from "modern-tar";
          import { unpackTar } from "modern-tar/fs";

          const archive = await packTar([{ header: { name: "hello.txt", size: 5 }, body: "hello" }]);
          await pipeline([archive], unpackTar("output"));
          assert.equal(await readFile("output/hello.txt", "utf8"), "hello");
          JS

  test:
    name: ${{ matrix.project }} on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24, 26]
        project: [node]
        include:
          - os: ubuntu-latest
            node-version: 24
            project: node
            coverage: true
          - os: ubuntu-latest
            node-version: 24
            project: workers
            build: true
          - os: ubuntu-latest
            node-version: 24
            project: browser
            browser: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup Node ${{ matrix.node-version }}
        if: matrix.node-version != 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Build
        if: matrix.build
        run: pnpm run build

      - name: Install Playwright browsers
        if: matrix.browser
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Test with coverage
        if: matrix.coverage
        run: node node_modules/vitest/vitest.mjs --project node --run --coverage

      - name: Test
        if: matrix.coverage != true
        run: node node_modules/vitest/vitest.mjs --project ${{ matrix.project }} --run
