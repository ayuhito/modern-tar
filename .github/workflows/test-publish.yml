name: Publish Any Commit

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build and validate package
        run: pnpm run build

      - name: Test
        run: pnpm test --run

      - name: Test TypeScript 5.7 declarations
        run: pnpm run test:types:compat

      - name: Publish
        run: pnpm dlx pkg-pr-new@0.0.86 publish
