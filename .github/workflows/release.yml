name: Release

on:
  release:
    types: [created]

permissions: {}

jobs:
  publish:
    name: Publish tagged source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Read version from tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag=$RELEASE_TAG
          version=${tag#v}
          if [[ "$tag" != "v$version" || -z "$version" ]]; then
            echo "Release tag must use the v<version> format" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Set package version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm version "$RELEASE_VERSION" --no-git-tag-version

      - name: Check
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build and validate package
        run: pnpm run build

      - name: Test
        run: pnpm test --run

      - name: Test TypeScript 5.7 declarations
        run: pnpm run test:types:compat

      - name: Pack release artifact
        run: |
          mkdir package-artifact
          pnpm pack --pack-destination package-artifact
          mv package-artifact/*.tgz package-artifact/modern-tar.tgz

      - name: Validate release artifact
        run: pnpm run check:package -- package-artifact/modern-tar.tgz

      - name: Test release artifact
        run: node scripts/smoke-package.mjs package-artifact/modern-tar.tgz

      - name: Publish release artifact
        run: npm publish package-artifact/modern-tar.tgz --access public --provenance

  bump-version:
    name: Record released version
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Update package version
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: pnpm version "$RELEASE_VERSION" --no-git-tag-version

      - name: Commit version bump
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions [Bot]"
          git add package.json
          git commit -m "chore: bump version to $RELEASE_VERSION"
          git push origin main
